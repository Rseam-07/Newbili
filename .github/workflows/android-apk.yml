name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build release candidates for local signature verification (not auto-published)
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
      - android
    paths:
      - AndroidFlutter/**
      - Scripts/*android*.sh
      - .github/workflows/android-apk.yml

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    env:
      RELEASE_CANDIDATE: ${{ inputs.release_candidate || github.ref == 'refs/heads/android' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          # setup-android still defaults to the retired `tools` package.
          packages: platform-tools

      - name: Install Android API 37 tools
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Prepare patched Flutter dependencies
        env:
          FLUTTER_BIN: ${{ env.FLUTTER_ROOT }}/bin/flutter
        run: Scripts/prepare-android-flutter.sh

      - name: Analyze and test
        working-directory: AndroidFlutter
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: Render interaction layout checks
        working-directory: AndroidFlutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          flutter test test/widgets/library_visual_test.dart \
            test/widgets/danmaku_composer_test.dart \
            test/widgets/tracking_library_test.dart \
            test/widgets/qr_login_panel_test.dart \
            test/widgets/player_feedback_test.dart \
            test/widgets/material_visual_test.dart --no-pub \
            --dart-define=NEWBILI_VISUAL_FONT=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            --dart-define=NEWBILI_VISUAL_COVERS=design/ui-review-2026-09-15/fixtures \
            --dart-define=NEWBILI_VISUAL_OUTPUT=build/visual-verification

      - name: Upload interaction layout checks
        uses: actions/upload-artifact@v7
        with:
          name: Newbili-Android-interaction-layouts
          path: AndroidFlutter/build/visual-verification/*.png
          if-no-files-found: error

      - name: Build debug APK
        if: ${{ env.RELEASE_CANDIDATE != 'true' }}
        working-directory: AndroidFlutter
        run: flutter build apk --debug --no-pub

      - name: Build release candidates
        id: release_apks
        if: ${{ env.RELEASE_CANDIDATE == 'true' }}
        working-directory: AndroidFlutter
        env:
          GRADLE_OPTS: -Dorg.gradle.project.newbiliDebugReleaseSigning=true
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ { print $2 }' pubspec.yaml)
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define "pili.name=${version%+*}" \
            --dart-define "pili.code=${version##*+}" \
            --dart-define "pili.hash=$(git rev-parse --short=12 HEAD)" \
            --dart-define "pili.time=$(date +%s)"

      - name: Run Android native unit tests
        working-directory: AndroidFlutter/android
        run: |
          set -euo pipefail
          # Flutter enables the debug unit-test variant. One engine ABI and
          # two workers keep Jetifier from loading three debug engines at once.
          ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError'

      - name: Upload native test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Newbili-Android-native-tests
          path: AndroidFlutter/build/app/test-results/**/TEST-*.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: ${{ env.RELEASE_CANDIDATE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Newbili-Android-ci-debug
          path: AndroidFlutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # The CI key is ephemeral. Re-sign locally with the existing public test
      # channel key and verify its digest before attaching APKs to a release.
      - name: Upload release candidates
        if: ${{ always() && steps.release_apks.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Newbili-Android-release-candidates
          path: AndroidFlutter/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
