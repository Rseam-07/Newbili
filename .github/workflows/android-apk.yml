name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - AndroidFlutter/**
      - Scripts/*android*.sh
      - .github/workflows/android-apk.yml

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 tools
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Prepare patched Flutter dependencies
        env:
          FLUTTER_BIN: ${{ env.FLUTTER_ROOT }}/bin/flutter
        run: Scripts/prepare-android-flutter.sh

      - name: Analyze and test
        working-directory: AndroidFlutter
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: Build debug APK
        working-directory: AndroidFlutter
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Newbili-Android-ci-debug
          path: AndroidFlutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
